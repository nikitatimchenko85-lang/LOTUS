<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LOTUS Конструктор сетапов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: top bar; three columns (catalog | stage canvas | inspector) with results (equipment, cables) under the canvas. Same tokens as LOTUS so it can become a tab there. */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunken:#E9EDEF; --fg:#15191D; --muted:#5B6670; --line:#D9DFE3;
  --accent:#B3306A; --accent-soft:#F6E3EC; --accent-ink:#FFFFFF;
  --ok:#2C7A4B; --ok-soft:#E1F1E7; --warn:#A86A12; --warn-soft:#FBEFD9; --bad:#BC3328; --bad-soft:#F8E1DE;
  --c-rig:#6656C8; --c-power:#B0601C; --c-light:#A9850F; --c-video:#2B78AD; --c-sound:#2A836A; --c-stage:#94478A; --c-sfx:#C2475A; --c-dj:#4F6BB8; --c-cam:#3D8C99; --c-other:#66727C;
  --floor:#FAFBFB; --grid:#E3E8EB; --grid2:#CDD5DA; --stage:#ECE4EA; --stage-edge:#94478A; --foh:#E4EEF5;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1215; --surface:#161B1F; --sunken:#1D2328; --fg:#E6EBEE; --muted:#93A0A9; --line:#2A3238;
  --accent:#E0679C; --accent-soft:#3A1F2C; --accent-ink:#1A0E14;
  --ok:#5CC38A; --ok-soft:#173326; --warn:#E3A84B; --warn-soft:#382A14; --bad:#F07A6E; --bad-soft:#3B1D1A;
  --c-rig:#9488E6; --c-power:#E08B48; --c-light:#E0C04A; --c-video:#5BA8DE; --c-sound:#4FC0A0; --c-stage:#CC7DC0; --c-sfx:#EC7A8B; --c-dj:#8098E6; --c-cam:#62BFCB; --c-other:#9AA6AF;
  --floor:#12171A; --grid:#1E252A; --grid2:#2C353C; --stage:#2A2029; --stage-edge:#CC7DC0; --foh:#16252F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1215; --surface:#161B1F; --sunken:#1D2328; --fg:#E6EBEE; --muted:#93A0A9; --line:#2A3238;
  --accent:#E0679C; --accent-soft:#3A1F2C; --accent-ink:#1A0E14;
  --ok:#5CC38A; --ok-soft:#173326; --warn:#E3A84B; --warn-soft:#382A14; --bad:#F07A6E; --bad-soft:#3B1D1A;
  --c-rig:#9488E6; --c-power:#E08B48; --c-light:#E0C04A; --c-video:#5BA8DE; --c-sound:#4FC0A0; --c-stage:#CC7DC0; --c-sfx:#EC7A8B; --c-dj:#8098E6; --c-cam:#62BFCB; --c-other:#9AA6AF;
  --floor:#12171A; --grid:#1E252A; --grid2:#2C353C; --stage:#2A2029; --stage-edge:#CC7DC0; --foh:#16252F;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
[hidden]{display:none!important}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1600px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.14em}
.brand span{color:var(--muted);font-size:12px}
.topact{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
main{padding-block:16px 60px}
h2{font-family:var(--f-display);font-weight:500;font-size:15px;margin:0 0 10px;letter-spacing:.02em}
h3{font-size:11px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
input,select{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input[type=number]{font-family:var(--f-mono);font-size:13px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:6px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button:hover{background:var(--sunken)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.07);background:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.sm{padding:3px 8px;font-size:12px}
button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.side{position:sticky;top:70px;max-height:calc(100vh - 84px);overflow:auto}
/* catalog */
.cat-h{display:flex;align-items:center;gap:6px;margin:12px 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.cat-h i{width:9px;height:9px;border-radius:2px;display:inline-block}
.eq{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 7px;border:1px solid transparent;border-radius:6px;background:transparent;font-weight:400;cursor:grab}
.eq:hover{background:var(--sunken);border-color:var(--line)}
.eq span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eq small{font-family:var(--f-mono);color:var(--muted);font-size:11px}
/* canvas */
.canvasbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ctool{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.ctool .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0}
svg.plan{display:block;width:100%;height:min(68vh,720px);background:var(--floor);touch-action:none;user-select:none;-webkit-user-select:none}
svg.front{display:block;width:100%;height:min(52vh,520px);background:var(--floor)}
.v3{position:relative;height:min(68vh,720px);background:var(--floor)}
.v3msg{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:var(--muted)}
.v3bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 10px;border-top:1px solid var(--line)}
.v3bar .sp{flex:1}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.legend label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.obj{cursor:move}
.obj.sel .body{stroke:var(--accent);stroke-width:.06}
.handle{fill:var(--surface);stroke:var(--accent);stroke-width:.05;cursor:crosshair}
.lbl{font-family:var(--f-body);fill:var(--fg);pointer-events:none}
.dim{font-family:var(--f-mono);fill:var(--muted);pointer-events:none}
/* inspector */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.f.full{grid-column:1/-1}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sep{height:1px;background:var(--line);margin:14px 0}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.selname{font-weight:600;margin:0 0 2px}
/* results */
.results{margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.stat b{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.stat.bad b{color:var(--bad)}
.tabs2{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.tabs2 button{border-radius:999px;border-color:transparent;color:var(--muted)}
.tabs2 button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--sunken);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-size:13px;white-space:nowrap}
tr.grp td{background:var(--sunken);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
tfoot td{font-weight:600;background:var(--sunken)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sunken);color:var(--muted);margin-left:6px;vertical-align:1px}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.neg{color:var(--bad);font-weight:600}
.warns{margin:0 0 12px;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.warns li{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:7px 10px;font-size:13px}
.swatch{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:8px;vertical-align:middle}
.pieces{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
@media (max-width:1100px){.layout{grid-template-columns:240px minmax(0,1fr)} .insp{grid-column:1/-1;position:static;max-height:none}}
@media (max-width:760px){header.top{position:static} .v3{height:60vh} .layout{grid-template-columns:minmax(0,1fr)} .side{position:static;max-height:340px} svg.plan{height:60vh}}
@media print{
  header.top .topact,.catalog,.ctool,.insp,.legend,.tabs2,#fileIn{display:none!important}
  .layout{display:block} .canvasbox,.panel,.tablebox{border:0}
  body{background:#fff} svg.plan{height:auto;aspect-ratio:var(--ar,1.4)} #frontwrap{display:block!important}
  .results [data-pane]{display:block!important;break-inside:avoid;margin-bottom:16px}
}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}
</style>
</head>
<body>
<header class="top"><div class="wrap topin">
  <div class="brand"><b>LOTUS</b><span>Конструктор сетапов</span></div>
  <input id="setupName" aria-label="Название сетапа" style="flex:0 1 260px">
  <div class="topact">
    <select id="preset" aria-label="Шаблон"><option value="">Шаблон…</option><option value="concert">Концерт: сцена 12×8</option><option value="club">Клуб: сцена 8×5, DJ</option><option value="conf">Конференция: сцена 10×4, экран</option><option value="empty">Пустая площадка</option></select>
    <button class="sm" data-act="undo" title="Ctrl+Z">Отменить</button>
    <button class="sm" data-act="copy" id="copyBtn">Копировать список</button>
    <button class="sm" data-act="export" data-file>Сохранить файл</button>
    <button class="sm" data-act="import">Открыть файл</button>
    <button class="sm" data-act="print" data-file>Печать / PDF</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>
  </div>
</div></header>

<main class="wrap">
  <div class="layout">
    <aside class="panel side catalog">
      <h2>Оборудование</h2>
      <input id="q" type="search" placeholder="Поиск по складу" style="width:100%">
      <p class="hint">Перетащите позицию на план или нажмите, чтобы поставить в центр сцены.</p>
      <div id="catalog"></div>
    </aside>

    <section>
      <div class="canvasbox">
        <div class="ctool">
          <div class="seg"><button class="sm" data-view="plan" aria-pressed="true">План</button><button class="sm" data-view="front" aria-pressed="false">Вид из зала</button><button class="sm" data-view="3d" aria-pressed="false">3D</button></div>
          <span class="sp"></span>
          <label class="hint" style="margin:0;display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="snap" checked> Шаг 0,25 м</label>
          <button class="sm" data-act="zin" aria-label="Приблизить">+</button><button class="sm" data-act="zout" aria-label="Отдалить">−</button><button class="sm" data-act="fit">Вписать</button>
        </div>
        <div id="planwrap"><svg class="plan" id="plan" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div id="wrap3d" hidden><div id="v3" class="v3"><p id="v3msg" class="v3msg">Загружаю 3D…</p></div>
          <div class="v3bar"><span class="hint" style="margin:0">Вращать: тянуть мышью или пальцем · сдвиг: правая кнопка или Shift · масштаб: колесо или щипок · клик выбирает прибор</span><span class="sp"></span>
            <button class="sm" data-cam="persp">3/4</button><button class="sm" data-cam="foh">С пульта</button><button class="sm" data-cam="top">Сверху</button><button class="sm" data-cam="side">Сбоку</button><label class="hint" style="margin:0;display:inline-flex;gap:5px;align-items:center"><input type="checkbox" id="beams" checked> Лучи</label></div></div>
        <div id="frontwrap" hidden><svg class="front" id="front" xmlns="http://www.w3.org/2000/svg"></svg></div>
        <div class="legend" id="legend"></div>
      </div>

      <div class="results">
        <div class="stats" id="stats"></div>
        <ul class="warns" id="warns"></ul>
        <div class="tabs2"><button data-pane-btn="eq" aria-pressed="true">Оборудование</button><button data-pane-btn="cab" aria-pressed="false">Кабели</button></div>
        <div data-pane="eq" id="eqTable"></div>
        <div data-pane="cab" id="cabTable" hidden></div>
      </div>
    </section>

    <aside class="panel side insp" id="insp"></aside>
  </div>
</main>

function kindOf(it){
  var n=it.name, s=it.sub||"";
  if(/КОММУТАЦИЯ/i.test(s)) return "cable";
  if(/Stage Deck|Stage structure/.test(n)) return "deck";
  if(/Truss 40 pillar/.test(n)) return "rigacc";
  if(/Truss|Ферма/.test(n)) return "truss";
  if(/Chain hoist/.test(n)) return "hoist";
  if(/J\/V-Frame|Рама подвеса/.test(n)) return "frame";
  if(/Mojo|Fan barrier/.test(n)) return "barrier";
  if(/Cable Protector/.test(n)) return "protector";
  if(/Base collar|Box corner|лебедками/.test(n)) return "rigacc";
  if(/генератор/.test(n)) return "gen";
  if(/Power Distributions/.test(n)) return "distro";
  if(/Gloshine/.test(n)) return "led";
  if(/^TV \d/.test(n)) return "tv";
  if(/проектор/.test(n)) return "proj";
  if(/SUB|INFRA|KS28/.test(n)) return "sub";
  if(/CHR15|B205D/.test(n)) return "aspk";
  if(/J8|V8|\bM4\b/.test(n)) return "spk";
  if(/усилители/i.test(s)) return "amp";
  if(/Rio|Tio/.test(n)) return "stagebox";
  if(/пульты/i.test(s)) return "console";
  if(/стойка/i.test(n)) return "stand";
  if(/микрофоны/i.test(s)) return "mic";
  if(/радиосистемы/i.test(s)) return "radio";
  if(/Follow Spot/.test(n)) return "light";
  if(/СВЕТ — приборы/i.test(s)) return "light";
  if(/ArtNet|Distributor|Splitter|NPU/.test(n)) return "node";
  if(/СВЕТ — управление/i.test(s)) return "lightdesk";
  if(/ВИДЕО — обработка/i.test(s)) return "vproc";
  if(/ВИДЕОСЪЕМКА/i.test(s)) return /Sony|Blackmagic/.test(n)?"cam":"camlight";
  if(/^DJ/.test(s)) return "dj";
  if(/БЭКЛАЙН/i.test(s)) return "backline";
  if(/Баллон|Бак|stand|Stand/.test(n)) return "other";
  if(/СПЕЦЭФФЕКТЫ/i.test(s)) return /Mirror/.test(n)?"other":"sfx";
  if(/СВЯЗЬ/i.test(s)) return "comm";
  return "other";
}
