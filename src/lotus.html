<title>LOTUS Склад и выезды</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky top bar with four sections (Склад, Сетапы, Погрузка, Финансы); each section is a toolbar + dense tables, editors open in a side sheet. */
:root{
  --bg:#F3F5F6; --surface:#FFFFFF; --sunken:#E9EDEF; --fg:#15191D; --muted:#5B6670; --line:#D9DFE3;
  --accent:#B3306A; --accent-soft:#F6E3EC; --accent-ink:#FFFFFF;
  --ok:#2C7A4B; --ok-soft:#E1F1E7; --warn:#A86A12; --warn-soft:#FBEFD9; --bad:#BC3328; --bad-soft:#F8E1DE;
  --c-rig:#6656C8; --c-power:#B0601C; --c-light:#A9850F; --c-video:#2B78AD; --c-sound:#2A836A; --c-stage:#94478A; --c-sfx:#C2475A; --c-dj:#4F6BB8; --c-cam:#3D8C99; --c-other:#66727C;
  --f-display:"Unbounded","Onest",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1215; --surface:#161B1F; --sunken:#1D2328; --fg:#E6EBEE; --muted:#93A0A9; --line:#2A3238;
  --accent:#E0679C; --accent-soft:#3A1F2C; --accent-ink:#1A0E14;
  --ok:#5CC38A; --ok-soft:#173326; --warn:#E3A84B; --warn-soft:#382A14; --bad:#F07A6E; --bad-soft:#3B1D1A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1215; --surface:#161B1F; --sunken:#1D2328; --fg:#E6EBEE; --muted:#93A0A9; --line:#2A3238;
  --accent:#E0679C; --accent-soft:#3A1F2C; --accent-ink:#1A0E14;
  --ok:#5CC38A; --ok-soft:#173326; --warn:#E3A84B; --warn-soft:#382A14; --bad:#F07A6E; --bad-soft:#3B1D1A;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.14em}
.brand span{color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{padding:7px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a:hover{color:var(--fg);background:var(--sunken)}
nav.tabs a[aria-current="page"]{background:var(--fg);color:var(--bg)}
.sync{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.demo{background:var(--warn)}
main{padding-block:20px 60px}
h1{font-family:var(--f-display);font-weight:500;font-size:22px;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-family:var(--f-display);font-weight:500;font-size:15px;margin:0 0 10px;letter-spacing:.02em}
h3{font-size:13px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted);max-width:65ch}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=number]{font-family:var(--f-mono);font-size:13px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:6px;padding:7px 12px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button:hover{background:var(--sunken)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.primary:hover{filter:brightness(1.07);background:var(--accent)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.danger{color:var(--bad);border-color:var(--bad)}
button.sm{padding:4px 8px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.stat b{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;background:var(--sunken)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-size:13px}
td.wrap{white-space:normal;min-width:180px}
tbody tr.click{cursor:pointer} tbody tr.click:hover{background:var(--sunken)}
tfoot td{font-weight:600;background:var(--sunken)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunken);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.cat{display:inline-flex;align-items:center;gap:6px}
.cat i{width:10px;height:10px;border-radius:3px;display:inline-block}
.ex{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card .t{font-weight:600;font-size:15px}
.card .row{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:13px}
.card .row b{color:var(--fg);font-family:var(--f-mono);font-weight:600}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 12px}
.grid label,.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.grid label.span2{grid-column:span 2}
@media (max-width:520px){.grid label.span2{grid-column:auto}}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)}}
.sumline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.sumline:last-child{border-bottom:0}
.sumline b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sumline.total{font-size:17px;padding-top:10px}
.sumline.total b{color:var(--accent)}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:13px}
.badbox{background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:8px 10px;font-size:13px}
.okbox{background:var(--ok-soft);color:var(--ok);border-radius:6px;padding:8px 10px;font-size:13px}
.meter{height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.truckgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
@media (max-width:600px){.truckgrid{grid-template-columns:minmax(0,1fr)}}
.svgbox{overflow-x:auto}
.svgbox svg{display:block;width:100%;min-width:380px;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,17,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.banner{background:var(--warn-soft);color:var(--warn);font-size:13px;padding-block:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;z-index:30;font-size:13px}
@media (max-width:640px){.hs{display:none}}
html.nofin .fin, html.ro .w{display:none!important}
.inline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.qty{width:72px}
.w100{width:100%}
@media (prefers-reduced-motion:no-preference){.card,button{transition:border-color .15s,background .15s}}
</style>

<header class="top"><div class="wrap topin">
  <div class="brand"><b>LOTUS</b><span>Lotus Arena · Пхукет</span></div>
  <nav class="tabs" id="tabs">
    <a href="#inventory" data-tab="inventory">Склад</a>
    <a href="#events" data-tab="events">Сетапы</a>
    <a href="#loading" data-tab="loading">Погрузка</a>
    <a href="#finance" data-tab="finance" class="fin">Финансы</a>
  </nav>
  <div class="sync"><button class="ghost sm" id="rolebtn" data-act="roles" hidden></button><span class="dot" id="syncdot"></span><span id="synctext">Подключение…</span></div>
</div></header>
<div class="banner" id="demobanner" hidden><div class="wrap">Демо-режим: хранилище недоступно в этом просмотре, изменения не сохранятся после перезагрузки.</div></div>
<main class="wrap" id="app"><div class="empty">Загружаю склад, сетапы и автопарк…</div></main>
<div id="sheetroot"></div>

<script>
(function(){
"use strict";
var CATS = {
  rig:   {name:"Риггинг и фермы", color:"var(--c-rig)", prio:1},
  stage: {name:"Сцена и конструкции", color:"var(--c-stage)", prio:2},
  power: {name:"Электрика и коммутация", color:"var(--c-power)", prio:3},
  light: {name:"Свет", color:"var(--c-light)", prio:4},
  video: {name:"Видео и LED", color:"var(--c-video)", prio:5},
  sound: {name:"Звук", color:"var(--c-sound)", prio:6},
  sfx:   {name:"Спецэффекты", color:"var(--c-sfx)", prio:7},
  dj:    {name:"DJ и бэклайн", color:"var(--c-dj)", prio:8},
  cam:   {name:"Видеосъёмка", color:"var(--c-cam)", prio:9},
  comm:  {name:"Связь", color:"var(--c-other)", prio:10},
  other: {name:"Прочее", color:"var(--c-other)", prio:11}
};
var STATUSES = {
  draft:{name:"Черновик",cls:""}, confirmed:{name:"Подтверждён",cls:"acc"}, onsite:{name:"На площадке",cls:"warn"},
  done:{name:"Завершён",cls:"ok"}, cancelled:{name:"Отменён",cls:"bad"}
};
var S = {items:{}, trucks:{}, events:{}, settings:{vat:7}, loaded:{items:false,trucks:false,events:false}, demo:false, tab:"inventory",
  invQ:"", invCat:"", loadEvent:"", finEvent:""};
var db = null;

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function n(v){v=parseFloat(v);return isFinite(v)?v:0}
var fmtB = new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0});
function baht(v){return fmtB.format(Math.round(v))+" ฿"}
function num(v,d){return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:d||0}).format(v)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function days(ev){ if(!ev.dateFrom) return 1; var a=new Date(ev.dateFrom), b=new Date(ev.dateTo||ev.dateFrom); return Math.max(1, Math.round((b-a)/864e5)+1)}
function fmtDate(d){ if(!d) return "—"; var x=new Date(d+"T00:00:00"); return x.toLocaleDateString("ru-RU",{day:"numeric",month:"short"})}
function range(ev){ return ev.dateTo && ev.dateTo!==ev.dateFrom ? fmtDate(ev.dateFrom)+" – "+fmtDate(ev.dateTo) : fmtDate(ev.dateFrom)}
function catTag(c){var k=CATS[c]||CATS.other;return '<span class="cat"><i style="background:'+k.color+'"></i>'+esc(k.name)+'</span>'}
function exTag(o){return o && o.example ? '<span class="ex" title="Пример для демонстрации">пример</span>' : ''}
function sortedItems(){return Object.keys(S.items).map(function(k){return S.items[k]}).sort(function(a,b){return (CATS[a.cat]||CATS.other).prio-(CATS[b.cat]||CATS.other).prio || String(a.name).localeCompare(b.name)})}
function sortedEvents(){return Object.keys(S.events).map(function(k){return S.events[k]}).sort(function(a,b){return String(a.dateFrom).localeCompare(String(b.dateFrom))})}
function sortedTrucks(){return Object.keys(S.trucks).map(function(k){return S.trucks[k]}).sort(function(a,b){return n(a.L)*n(a.W)-n(b.L)*n(b.W)})}
var toastT;
function toast(msg){var t=$("#toast"); if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)} t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2200)}

/* ---------- storage ----------
   Money lives in the admin-only "fin" collection (doc ids item-<id>, truck-<id>, event-<id>);
   public collections hold the rest. The page merges both into S.items / S.trucks / S.events. */
var FIN={items:["rate","value","amort"],trucks:["ratePerDay","ratePerKm"],events:["crew","extra","discount","nextDayPct","vat"]};
var PREFIX={items:"item-",trucks:"truck-",events:"event-"};
var RAW={items:{},trucks:{},events:{}}, FINDOCS={};
var ROLE={admin:true,write:true,known:false};
function rebuild(){
  ["items","trucks","events"].forEach(function(coll){ var m={};
    Object.keys(RAW[coll]).forEach(function(id){ var o=clone(RAW[coll][id]), f=FINDOCS[PREFIX[coll]+id]; if(f) FIN[coll].forEach(function(k){ if(f[k]!==undefined) o[k]=f[k] }); o.id=id; m[id]=o });
    S[coll]=m });
}
function split(coll,obj){ var pub=clone(obj), fin={}; FIN[coll].forEach(function(k){ if(pub[k]!==undefined) fin[k]=pub[k]; delete pub[k] }); pub.id=obj.id; return {pub:pub,fin:fin} }
function fail(e){toast("Не удалось сохранить: "+(e&&(e.message||e.code)||"ошибка"))}
function save(coll,obj){
  var p=split(coll,obj);
  RAW[coll][obj.id]=p.pub; if(ROLE.admin) FINDOCS[PREFIX[coll]+obj.id]=p.fin; rebuild();
  if(db){
    var w=[db.collection(coll).doc(obj.id).set(p.pub)];
    if(ROLE.admin) w.push(db.collection("fin").doc(PREFIX[coll]+obj.id).set(p.fin));
    return Promise.all(w).then(function(){toast("Сохранено")},fail);
  }
  render(); toast("Сохранено (демо)"); return Promise.resolve();
}
function remove(coll,id){
  delete RAW[coll][id]; delete FINDOCS[PREFIX[coll]+id]; rebuild();
  if(db){ var w=[db.collection(coll).doc(id).delete()]; if(ROLE.admin) w.push(db.collection("fin").doc(PREFIX[coll]+id).delete());
    return Promise.all(w).then(function(){toast("Удалено")},function(e){toast("Не удалось удалить: "+(e&&(e.message||e.code)))}) }
  render(); return Promise.resolve();
}
function patchEvent(id,fields){
  var ev=RAW.events[id]; if(!ev) return;
  Object.keys(fields).forEach(function(k){ev[k]=fields[k]}); rebuild();
  if(db){ db.collection("events").doc(id).update(fields).catch(fail) } else render();
}

/* ---------- availability ---------- */
function overlaps(a,b){ var a1=a.dateFrom||"", a2=a.dateTo||a.dateFrom||"", b1=b.dateFrom||"", b2=b.dateTo||b.dateFrom||""; return a1 && b1 && a1<=b2 && b1<=a2 }
function bookedFor(itemId, ev, excludeId){
  var t=0; Object.keys(S.events).forEach(function(k){ var e=S.events[k]; if(k===excludeId || e.status==="cancelled" || e.status==="done") return;
    if(overlaps(e,ev)) (e.items||[]).forEach(function(r){ if(r.itemId===itemId) t+=n(r.qty) }) }); return t;
}
function todayStr(){var d=new Date();return d.toISOString().slice(0,10)}
function freeToday(it){ var ev={dateFrom:todayStr(),dateTo:todayStr()}; return n(it.qty)-n(it.repair)-bookedFor(it.id,ev,null) }

/* ---------- money ---------- */
function calc(ev){
  var d=days(ev), next=(ev.nextDayPct==null?100:n(ev.nextDayPct))/100, dayFactor=1+(d-1)*next;
  var rental=[], rentalSum=0, amort=0, noRate=0;
  (ev.items||[]).forEach(function(r){ var it=S.items[r.itemId]; if(!it) return; var s=n(it.rate)*n(r.qty)*dayFactor; rentalSum+=s; amort+=n(it.amort)*n(r.qty)*d; if(!n(it.rate)) noRate++; rental.push({name:it.name,qty:n(r.qty),rate:n(it.rate),sum:s}) });
  var disc=rentalSum*n(ev.discount)/100;
  var crewSum=0, crew=(ev.crew||[]).map(function(c){var s=n(c.people)*n(c.days)*n(c.rate); crewSum+=s; return {role:c.role,people:n(c.people),days:n(c.days),rate:n(c.rate),sum:s}});
  var logi=[], logiSum=0, km=n(ev.distanceKm)*2*Math.max(1,n(ev.trips||1));
  (ev.truckIds||[]).forEach(function(tid){var t=S.trucks[tid]; if(!t) return; var s=n(t.ratePerDay)*d+n(t.ratePerKm)*km; logiSum+=s; logi.push({name:t.name,days:d,km:km,sum:s})});
  var extraSum=0, extra=(ev.extra||[]).map(function(x){extraSum+=n(x.amount);return {name:x.name,sum:n(x.amount)}});
  var sub=rentalSum-disc+crewSum+logiSum+extraSum, vat=ev.vat? sub*n(S.settings.vat)/100 : 0;
  return {d:d,amort:amort,noRate:noRate,dayFactor:dayFactor,rental:rental,rentalSum:rentalSum,disc:disc,crew:crew,crewSum:crewSum,logi:logi,logiSum:logiSum,km:km,extra:extra,extraSum:extraSum,sub:sub,vat:vat,total:sub+vat};
}

/* ---------- truck packing ---------- */
function plan(ev, truckIds){
  var units=[];
  (ev.items||[]).forEach(function(r){ var it=S.items[r.itemId]; if(!it) return;
    for(var i=0;i<n(r.qty);i++) units.push({key:it.id+"#"+(i+1), itemId:it.id, name:it.name, idx:i+1, of:n(r.qty), cat:it.cat||"other",
      l:Math.max(n(it.L),1), w:Math.max(n(it.W),1), h:Math.max(n(it.H),1), kg:n(it.kg), stack:!!it.stackable, prio:(CATS[it.cat]||CATS.other).prio}) });
  // last needed on site goes in first (toward the cab)
  units.sort(function(a,b){return b.prio-a.prio || (b.l*b.w)-(a.l*a.w) || b.h-a.h});
  var trucks=(truckIds||[]).map(function(id){return S.trucks[id]}).filter(Boolean).map(function(t){return {t:t,label:t.name,L:n(t.L),W:n(t.W),H:n(t.H),max:n(t.payload),stacks:[],kg:0,vol:0,usedL:0}});
  var seen={}; trucks.forEach(function(T){seen[T.t.id]=(seen[T.t.id]||0)+1; if(truckIds.filter(function(x){return x===T.t.id}).length>1) T.label=T.t.name+" №"+seen[T.t.id]});
  var maxH=trucks.length?trucks.reduce(function(m,t){return Math.min(m,t.H)},1e9):220;
  // build stacks inside one priority group
  var stacks=[];
  units.forEach(function(u){
    var s=null;
    if(u.stack){ for(var i=stacks.length-1;i>=0;i--){ var c=stacks[i]; if(c.prio!==u.prio) break; var top=c.units[c.units.length-1];
      if(top.stack && c.h+u.h<=maxH && Math.max(u.l,u.w)<=Math.max(top.l,top.w) && Math.min(u.l,u.w)<=Math.min(top.l,top.w)){s=c;break} } }
    if(!s){ s={units:[],l:u.l,w:u.w,h:0,kg:0,prio:u.prio,cat:u.cat}; stacks.push(s) }
    s.units.push(u); s.h+=u.h; s.kg+=u.kg;

      var spot=findSpot(T,s);

/* bottom-left placement: push each stack as close to the cab (x=0), then to one wall, as possible */
function findSpot(T,s){
  // a stack never goes deeper (toward the cab) than stacks from groups loaded before it, so unloading order holds
  var minX=0; T.stacks.forEach(function(o){ if(o.prio>s.prio) minX=Math.max(minX,o.x) });
  var cand=[{x:0,y:0}]; T.stacks.forEach(function(o){cand.push({x:o.x+o.dx,y:o.y});cand.push({x:o.x,y:o.y+o.dy});cand.push({x:o.x+o.dx,y:0});cand.push({x:0,y:o.y+o.dy})});
  var best=null;
  [[s.l,s.w],[s.w,s.l]].forEach(function(dim){ var dx=dim[0], dy=dim[1];
    cand.forEach(function(c){
      if(c.x<minX || c.x+dx>T.L || c.y+dy>T.W) return;
      for(var k=0;k<T.stacks.length;k++){var o=T.stacks[k]; if(c.x<o.x+o.dx && o.x<c.x+dx && c.y<o.y+o.dy && o.y<c.y+dy) return}
      var score=(c.x+dx)*10000+c.y; // keep the load front edge short, then hug the wall
      if(!best || score<best.score) best={x:c.x,y:c.y,dx:dx,dy:dy,score:score};
    }) });

}
function suggestTrucks(ev){
  var all=sortedTrucks(); if(!all.length) return null;
  var cost=function(ids){return ids.reduce(function(m,id){return m+n(S.trucks[id].ratePerDay)},0)};
  var fits=function(ids){return !plan(ev,ids).overflow.length};
  var opts=[]; all.forEach(function(a){opts.push([a.id])}); all.forEach(function(a,i){all.forEach(function(b,j){ if(j>=i) opts.push([b.id,a.id]) })});
  opts.sort(function(x,y){return cost(x)-cost(y)});
  for(var i=0;i<opts.length;i++) if(fits(opts[i])) return opts[i];
  var big=all[all.length-1], ids=[big.id,big.id];
  for(var k=0;k<6;k++){ ids.push(big.id); if(fits(ids)) return ids }
  return ids;
}

function quoteText(ev){var c=calc(ev),L=[];L.push("Смета: "+(ev.name||""));L.push([ev.client,ev.venue,range(ev)].filter(Boolean).join(" · "));L.push("");
  L.push("Аренда оборудования ("+c.d+" дн.):");c.rental.forEach(function(r){L.push("  "+r.name+" × "+r.qty+" — "+baht(r.sum))});if(c.disc)L.push("  Скидка "+n(ev.discount)+"% — −"+baht(c.disc));
  L.push("Работы:");c.crew.forEach(function(r){L.push("  "+r.role+": "+r.people+" чел. × "+r.days+" дн. — "+baht(r.sum))});

  openSheet(h,function(sh){
    function readBasic(){ ["name","client","venue","dateFrom","dateTo","status","notes"].forEach(function(k){ev[k]=$("#e_"+k,sh).value}); if(ev.dateTo<ev.dateFrom) ev.dateTo=ev.dateFrom;
      ["distanceKm","trips","discount","nextDayPct"].forEach(function(k){ev[k]=n($("#e_"+k,sh).value)}); ev.vat=$("#e_vat",sh).checked;
      var ids=[]; Array.prototype.forEach.call(sh.querySelectorAll("[data-truck]"),function(inp){for(var i=0;i<n(inp.value);i++) ids.push(inp.dataset.truck)}); ev.truckIds=ids }
    function total(){ readBasic(); var c=calc(ev); $("#e_total",sh).innerHTML=sumLine("Аренда",c.rentalSum-c.disc)+sumLine("Работы",c.crewSum)+sumLine("Логистика",c.logiSum)+sumLine("Прочее",c.extraSum)+'<div class="sumline total"><span>Итого'+(ev.vat?" с НДС":"")+'</span><b>'+baht(c.total)+'</b></div>' }
    function redrawItems(){ $("#e_items",sh).innerHTML=itemsTable(); total() }
    sh.addEventListener("input",function(e){ var t=e.target;
      if(t.dataset.iq!=null){ ev.items[+t.dataset.iq].qty=n(t.value) }
      if(t.dataset.ci!=null){ ev.crew[+t.dataset.ci][t.dataset.cf]= t.dataset.cf==="role"?t.value:n(t.value) }
      if(t.dataset.xi!=null){ ev.extra[+t.dataset.xi][t.dataset.xf]= t.dataset.xf==="name"?t.value:n(t.value) }
      total() });
    sh.addEventListener("change",function(e){ if(e.target.dataset.iq!=null || e.target.id==="e_dateFrom" || e.target.id==="e_dateTo") redrawItems() });
    sh.addEventListener("click",function(e){ var t=e.target.closest("button"); if(!t) return;
      if(t.dataset.irm!=null){ ev.items.splice(+t.dataset.irm,1); redrawItems() }
      if(t.dataset.crm!=null){ ev.crew.splice(+t.dataset.crm,1); $("#e_crew",sh).innerHTML=crewRows(); total() }
      if(t.dataset.xrm!=null){ ev.extra.splice(+t.dataset.xrm,1); $("#e_extra",sh).innerHTML=extraRows(); total() } });
    $("#e_add",sh).onclick=function(){ var iid=$("#e_pick",sh).value, q=Math.max(1,n($("#e_pickq",sh).value)); if(!iid) return;
      var ex=ev.items.filter(function(r){return r.itemId===iid})[0]; if(ex) ex.qty=n(ex.qty)+q; else ev.items.push({itemId:iid,qty:q}); redrawItems() };
    $("#e_addcrew",sh).onclick=function(){ ev.crew.push({role:"",people:1,days:days(ev),rate:1500}); $("#e_crew",sh).innerHTML=crewRows(); total() };
    $("#e_addx",sh).onclick=function(){ ev.extra.push({name:"",amount:0}); $("#e_extra",sh).innerHTML=extraRows(); total() };
    $("#b_cancel",sh).onclick=closeSheet;
    function doSave(){ readBasic(); if(!ev.name.trim()){ $("#e_name",sh).focus(); toast("Укажите название сетапа"); return false } ev.name=ev.name.trim(); save("events",ev); return true }
    $("#b_save",sh).onclick=function(){ if(doSave()) closeSheet() };
    $("#b_load",sh).onclick=function(){ if(doSave()){ S.loadEvent=ev.id; sheetOpen=false; $("#sheetroot").innerHTML=""; if(location.hash!=="#loading") location.hash="loading"; else render() } };
    confirmDel(sh,"#b_del","Удалить сетап вместе со сметой и чек-листом?",function(){remove("events",id);closeSheet()});
    total();
  });
}

/* ---------- bindings ---------- */
function bind(app){
  var q=$("#invQ",app); if(q) q.oninput=function(){ S.invQ=q.value; var pos=q.selectionStart; render(); var q2=$("#invQ"); q2.focus(); try{q2.setSelectionRange(pos,pos)}catch(e){} };
  var c=$("#invCat",app); if(c) c.onchange=function(){S.invCat=c.value;render()};
  var le=$("#loadEv",app); if(le) le.onchange=function(){S.loadEvent=le.value;render()};
  var fe=$("#finEv",app); if(fe) fe.onchange=function(){S.finEvent=fe.value;render()};
  Array.prototype.forEach.call(app.querySelectorAll("[data-chk]"),function(cb){ cb.onchange=function(){ var ev=S.events[S.loadEvent]; var chk=clone(ev.check||{}); var k=cb.dataset.chk; chk[k]=chk[k]||{}; chk[k][cb.dataset.f]=cb.checked; patchEvent(ev.id,{check:chk}) } });
}
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]"); if(!t || t.closest("#sheetroot")) return;
  var a=t.dataset.act, id=t.dataset.id;
  if(a==="newItem") itemSheet(null); else if(a==="editItem") itemSheet(id);
  else if(a==="newTruck") truckSheet(null); else if(a==="editTruck") truckSheet(id);
  else if(a==="newEvent") eventSheet(null); else if(a==="editEvent") eventSheet(id);
  else if(a==="roles") rolesSheet();
  else if(a==="finPick"){ S.finEvent=id; render(); var tb=document.querySelector("#finEv"); tb&&tb.scrollIntoView({behavior:"smooth",block:"center"}) }
  else if(a==="applyTrucks"){ patchEvent(S.loadEvent,{truckIds:t.dataset.ids.split(",")}); toast("Транспорт назначен") }
  else if(a==="resetCheck"){ patchEvent(S.loadEvent,{check:{}}) }
  else if(a==="copyQuote"){ var txt=quoteText(S.events[S.finEvent]); try{ navigator.clipboard.writeText(txt).then(function(){toast("Смета скопирована")},function(){showText(txt)}) }catch(err){ showText(txt) } }
});
function showText(txt){ openSheet('<h1>Смета текстом</h1><p class="muted">Выделите и скопируйте.</p><textarea id="qtxt" rows="20" class="w100" readonly>'+esc(txt)+'</textarea><div class="acts"><button id="b_cancel">Закрыть</button></div>',function(sh){$("#b_cancel",sh).onclick=closeSheet; var ta=$("#qtxt",sh); ta.focus(); ta.select()}) }
window.addEventListener("hashchange",function(){ if(sheetOpen){ sheetOpen=false; $("#sheetroot").innerHTML="" } render() });

    I("i-motor","Моторы CM Lodestar 1 т (кейс на 1)","rig",8,60,45,60,58,true,900,"Склад D"),I("i-truss","Ферма Prolyte H30V, 3 м","rig",16,300,30,30,22,true,350,"Склад D, стеллаж"),
    I("i-distro","Дистрибьютор питания 63 А","power",3,60,60,80,85,false,1500,"Склад C"),I("i-cable","Кейс кабелей (силовые и DMX)","power",6,120,60,60,90,true,600,"Склад C")];
  var trucks=[{id:"t-6w",name:"6-колёсный трак 4,2 м",plate:"",L:420,W:200,H:200,payload:3000,ratePerDay:4500,ratePerKm:18,example:true},{id:"t-10w",name:"10-колёсный трак 7,2 м",plate:"",L:720,W:235,H:240,payload:8000,ratePerDay:9000,ratePerKm:28,example:true}];
  var d=new Date(), iso=function(add){var x=new Date(d.getTime()+add*864e5);return x.toISOString().slice(0,10)};
  var events=[{id:"e-wed",name:"Свадьба на вилле",client:"Wedding-агентство",venue:"Камала",dateFrom:iso(10),dateTo:iso(11),status:"confirmed",example:true,
      items:[{itemId:"i-k2",qty:8},{itemId:"i-ks28",qty:4},{itemId:"i-sd12",qty:1},{itemId:"i-mega",qty:4},{itemId:"i-ma3",qty:1},{itemId:"i-motor",qty:4},{itemId:"i-truss",qty:8},{itemId:"i-distro",qty:1},{itemId:"i-cable",qty:3}],
      truckIds:["t-10w","t-6w"],distanceKm:25,trips:1,crew:[{role:"Звукорежиссёр",people:1,days:2,rate:4000},{role:"Художник по свету",people:1,days:2,rate:4000},{role:"Техники монтажа",people:6,days:2,rate:1800},{role:"Риггер",people:2,days:1,rate:3000}],
      extra:[{name:"Питание бригады",amount:4800}],discount:10,nextDayPct:50,vat:true,notes:""}];
  return {items:items,trucks:trucks,events:events};
}
function goDemo(){
  S.demo=true; var d=demoData(); ["items","trucks","events"].forEach(function(k){ d[k].forEach(function(o){var p=split(k,o); RAW[k][o.id]=p.pub; FINDOCS[PREFIX[k]+o.id]=p.fin}); S.loaded[k]=true }); rebuild();
  $("#syncdot").className="dot demo"; $("#synctext").textContent="Демо-режим"; $("#demobanner").hidden=false; render();
}

/* ---------- boot ---------- */
setTab(); render();
var ROLES={admin:{name:"Руководитель",cls:"acc"},staff:{name:"Склад и логистика",cls:"ok"},view:{name:"Только просмотр",cls:""}};
function roleKey(){return ROLE.admin?"admin":ROLE.write?"staff":"view"}
function applyRole(){
  document.documentElement.classList.toggle("ro",!ROLE.write);
  document.documentElement.classList.toggle("nofin",!ROLE.admin);
  var r=ROLES[roleKey()], b=$("#rolebtn"); b.hidden=false; b.innerHTML='<span class="pill '+r.cls+'">'+r.name+'</span>';
}
function start(){
  if(!window.claude || !window.claude.use){ goDemo(); applyRole(); return }
  window.claude.use("db").then(function(d){
    if(!d){ goDemo(); applyRole(); return }
    db=d; $("#syncdot").className="dot on"; $("#synctext").textContent="Синхронизировано";
    window.claude.use("user").then(function(u){
      if(!u){ ROLE={admin:false,write:true,known:false}; return }
      return Promise.all([u.canEdit(),u.can("data.write")]).then(function(r){ ROLE={admin:!!r[0],write:r[0]||r[1]!==false,known:true} });
    }).catch(function(){ ROLE={admin:false,write:true,known:false} }).then(function(){
      applyRole(); render();
      ["items","trucks","events"].forEach(function(coll){
        db.collection(coll).limit(1000).onSnapshot(function(snap){
          var m={}; snap.docs.forEach(function(doc){ var o=clone(doc.data()); o.id=doc.id; m[doc.id]=o }); RAW[coll]=m; S.loaded[coll]=true; rebuild(); render();
        },function(){ $("#syncdot").className="dot"; $("#synctext").textContent="Нет связи с хранилищем"; S.loaded[coll]=true; render() });
      });
      if(ROLE.admin) db.collection("fin").limit(1000).onSnapshot(function(snap){ var m={}; snap.docs.forEach(function(doc){m[doc.id]=clone(doc.data())}); FINDOCS=m; rebuild(); render() },function(){});
    });
  },function(){ goDemo(); applyRole() });
}
function rolesSheet(){
  var cur=roleKey();
  var rows=[["Склад: оборудование, количество, места, ремонт","✓","✓","смотрит"],["Сетапы: даты, оборудование, транспорт","✓","✓","смотрит"],["Погрузка: схема и чек-лист","✓","✓ отмечает","смотрит"],["Автопарк","✓","✓","смотрит"],["Цены аренды, стоимость и амортизация","✓","скрыто","скрыто"],["Финансы, сметы, ставки бригады","✓","скрыто","скрыто"]];
  openSheet('<h1>Роли и доступ</h1><p>Ваша роль: <span class="pill '+ROLES[cur].cls+'">'+ROLES[cur].name+'</span></p>'+
    '<div class="tablebox"><table><thead><tr><th></th><th>Руководитель</th><th>Склад и логистика</th><th>Только просмотр</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td class="wrap">'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td><td class="muted">'+r[3]+'</td></tr>'}).join("")+'</tbody></table></div>'+
    '<h3>Как выдать роль</h3><p style="margin:0">Роль задаётся в меню «Поделиться» этой страницы: <b>Editor</b> — руководитель, <b>Contributor</b> — склад и логистика, <b>Viewer</b> — только просмотр. Цены и финансы скрыты на уровне хранилища: без роли руководителя их нельзя получить даже в обход интерфейса.</p>'+
    '<div class="acts"><button id="b_cancel">Закрыть</button></div>',function(sh){$("#b_cancel",sh).onclick=closeSheet});
}
start();
})();
</script>
